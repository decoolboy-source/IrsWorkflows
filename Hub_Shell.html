<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Shell — Suite Thiết kế Kho lạnh NH3</title>
<meta name="description" content="Điều phối 4 trạm tính toán (RefrigDesignNH3 → NH3 Vessel → Pressure Vessel → BOQ &amp; Cost Estimate) thành một quy trình liền mạch.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1830; --panel:#111b34; --panel2:#0d1526;
    --border:#1f2c4d; --border2:#2a3a63;
    --t1:#eaf0ff; --t2:#9db0d8; --t3:#6c7ea8;
    --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,.14); --cyan-b:rgba(34,211,238,.35);
    --green:#10b981; --green-dim:rgba(16,185,129,.14); --green-b:rgba(16,185,129,.35);
    --amber:#fbbf24; --amber-dim:rgba(251,191,36,.14); --amber-b:rgba(251,191,36,.35);
    --fuchsia:#e879f9; --fuchsia-dim:rgba(232,121,249,.14); --fuchsia-b:rgba(232,121,249,.35);
    --red:#f87171; --red-dim:rgba(248,113,113,.14); --red-b:rgba(248,113,113,.35);
    --radius:14px; --radius-sm:9px;
    --shadow: 0 8px 28px rgba(0,0,0,.35);
    --sidebar-w: 250px; --bottomnav-h: 62px; --topbar-h: 52px;
    --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--t1); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  #shell{display:flex; height:100vh; height:100dvh}

  /* ───────── Sidebar (desktop) / Bottom nav (mobile) ───────── */
  #nav{
    width:var(--sidebar-w); flex:0 0 auto; background:var(--panel2); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:14px 10px; gap:4px; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px 8px}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 220deg,var(--cyan),var(--green),var(--amber),var(--fuchsia));flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
  .brand-text{display:flex;flex-direction:column;line-height:1.15}
  .brand-text b{font-size:13.5px;letter-spacing:.2px}
  .brand-text span{font-size:10px;color:var(--t3)}

  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 10px; border-radius:var(--radius-sm);
    cursor:pointer; color:var(--t2); border:1px solid transparent; position:relative; user-select:none;
    transition:background .15s,color .15s,border-color .15s;
  }
  .nav-item:hover{background:var(--panel); color:var(--t1)}
  .nav-item.active{background:var(--panel); color:var(--t1); border-color:var(--border2)}
  .nav-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent,var(--cyan))}
  .nav-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px;font-weight:800;background:var(--dim,var(--cyan-dim));color:var(--accent,var(--cyan));border:1px solid var(--b,var(--cyan-b))}
  .nav-label{flex:1;min-width:0}
  .nav-label b{display:block;font-size:12.3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-label span{display:block;font-size:9.5px;color:var(--t3)}
  .status-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--border2)}
  .status-dot.pending{background:var(--t3)}
  .status-dot.ready{background:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}
  .status-dot.pass{background:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
  .status-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-dim)}
  .status-dot.fail{background:var(--red);box-shadow:0 0 0 3px var(--red-dim)}
  .status-dot.pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .nav-sep{height:1px;background:var(--border);margin:10px 4px}
  .nav-foot{margin-top:auto; display:flex; flex-direction:column; gap:6px; padding-top:10px}
  .ghost-btn{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
    background:transparent; border:1px solid var(--border); color:var(--t2); font-size:11.5px; cursor:pointer;
    transition:.15s;
  }
  .ghost-btn:hover{border-color:var(--border2); color:var(--t1); background:var(--panel)}

  /* ───────── Topbar ───────── */
  #main{flex:1; min-width:0; display:flex; flex-direction:column; height:100%}
  #topbar{
    height:var(--topbar-h); flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:0 16px; border-bottom:1px solid var(--border); background:var(--bg2);
  }
  #topbar .crumb{font-size:12.5px; color:var(--t3); display:flex; align-items:center; gap:6px; overflow:hidden}
  #topbar .crumb b{color:var(--t1); font-weight:600; white-space:nowrap}
  #topbar .spacer{flex:1}
  #advanceBtn{
    display:none; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; cursor:pointer;
    background:var(--cyan-dim); border:1px solid var(--cyan-b); color:var(--cyan); font-size:11.5px; font-weight:700;
    transition:.15s;
  }
  #advanceBtn:hover{filter:brightness(1.15)}
  #advanceBtn:active{transform:scale(.97)}
  .icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:14px}
  .icon-btn:hover{color:var(--t1);border-color:var(--border2)}

  /* ───────── Content area ───────── */
  #content{flex:1; min-height:0; position:relative}
  #view-overview{position:absolute; inset:0; overflow-y:auto; padding:22px 26px 60px}
  /* #frames luôn phủ kín #content kể cả khi rỗng (đang ở Tổng quan, chưa
     mở trạm nào) — pointer-events:none để không chặn click/lăn chuột lên
     #view-overview bên dưới. .frame-wrap trả lại pointer-events:auto vì
     pointer-events được kế thừa xuống con mặc định. */
  #frames{position:absolute; inset:0; pointer-events:none}
  .frame-wrap{position:absolute; inset:0; display:none; pointer-events:auto}
  .frame-wrap.active{display:block}
  .frame-wrap iframe{width:100%; height:100%; border:0; background:#0d1526}
  .frame-loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:var(--bg); color:var(--t3); font-size:12px}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border2);border-top-color:var(--cyan);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ───────── Overview dashboard ───────── */
  .ov-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
  .ov-title{font-size:19px; font-weight:700}
  .ov-sub{font-size:12px; color:var(--t3); margin-top:4px}
  .progress-wrap{min-width:220px}
  .progress-bar{height:8px; border-radius:999px; background:var(--panel); overflow:hidden; display:flex; border:1px solid var(--border)}
  .progress-bar i{display:block; height:100%}
  .progress-label{font-size:10.5px; color:var(--t3); margin-top:6px; display:flex; justify-content:space-between}
  .new-project-btn{
    display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px; cursor:pointer; white-space:nowrap;
    background:var(--cyan-dim); border:1px solid var(--cyan-b); color:var(--cyan); font-size:12px; font-weight:700;
    transition:.15s;
  }
  .new-project-btn:hover{filter:brightness(1.15)}
  .new-project-btn:active{transform:scale(.97)}

  .pipeline{display:flex; align-items:center; gap:0; margin-bottom:26px; overflow-x:auto; padding-bottom:6px}
  .pipe-node{display:flex; flex-direction:column; align-items:center; gap:8px; flex:0 0 auto; width:120px; text-align:center}
  .pipe-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:2px solid var(--b);background:var(--dim);color:var(--accent)}
  .pipe-node small{font-size:10px; color:var(--t3); line-height:1.3}
  .pipe-node b{font-size:11px}
  .pipe-line{flex:1; height:2px; background:linear-gradient(90deg,var(--border2),var(--border2)); min-width:26px; position:relative; top:-22px; margin:0 -14px}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:14px}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
    display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:.15s; position:relative; overflow:hidden;
  }
  .card:hover{border-color:var(--border2); transform:translateY(-1px); box-shadow:var(--shadow)}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .card-top{display:flex; align-items:center; gap:10px}
  .card-badge{width:34px;height:34px;border-radius:10px;background:var(--dim);border:1px solid var(--b);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
  .card-title{flex:1; min-width:0}
  .card-title b{display:block; font-size:13.5px}
  .card-title span{display:block; font-size:10px; color:var(--t3)}
  .badge{font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; letter-spacing:.3px}
  .badge.pending{background:var(--panel2); color:var(--t3); border:1px solid var(--border)}
  .badge.ready{background:var(--cyan-dim); color:var(--cyan); border:1px solid var(--cyan-b)}
  .badge.pass{background:var(--green-dim); color:var(--green); border:1px solid var(--green-b)}
  .badge.warn{background:var(--amber-dim); color:var(--amber); border:1px solid var(--amber-b)}
  .badge.fail{background:var(--red-dim); color:var(--red); border:1px solid var(--red-b)}
  .card-meta{font-size:11px; color:var(--t2); line-height:1.5; min-height:32px}
  .card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:4px; font-size:10.5px; color:var(--t3)}
  .card-cta{font-size:11px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:4px}

  .empty-hint{border:1px dashed var(--border2); border-radius:var(--radius); padding:16px; font-size:11.5px; color:var(--t3); margin-top:22px; line-height:1.6}
  .empty-hint b{color:var(--t2)}

  /* ───────── Toasts ───────── */
  #toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:900; max-width:min(360px,86vw)}
  .toast{background:var(--panel); border:1px solid var(--border2); border-radius:11px; padding:11px 13px; font-size:11.5px; box-shadow:var(--shadow); display:flex; gap:9px; align-items:flex-start; animation:toastin .18s ease}
  .toast b{display:block; margin-bottom:2px}
  .toast.ok{border-left:3px solid var(--green)}
  .toast.warn{border-left:3px solid var(--amber)}
  .toast.info{border-left:3px solid var(--cyan)}
  @keyframes toastin{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  /* ───────── Modal ───────── */
  .modal-backdrop{position:fixed; inset:0; background:rgba(4,8,18,.6); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:950; padding:16px}
  .modal-backdrop.open{display:flex}
  .modal{background:var(--panel); border:1px solid var(--border2); border-radius:var(--radius); width:100%; max-width:420px; max-height:82vh; overflow-y:auto; box-shadow:var(--shadow)}
  .modal-head{padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:center}
  .modal-head b{font-size:14px}
  .modal-body{padding:6px 18px 18px; display:flex; flex-direction:column; gap:10px}
  .modal-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); gap:10px}
  .modal-row.selected{border-color:var(--cyan-b); background:var(--cyan-dim)}
  .modal-row-title{font-size:12px; font-weight:600}
  .modal-row-sub{font-size:10px; color:var(--t3)}
  .field{display:flex; flex-direction:column; gap:5px}
  .field label{font-size:10.5px; color:var(--t3)}
  .field input[type=text]{background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:9px 10px; color:var(--t1); font-size:12.5px}
  .field input:focus{outline:none; border-color:var(--cyan-b)}
  .btn-row{display:flex; gap:8px; margin-top:4px}
  .btn{flex:1; padding:9px 12px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--t2); font-size:12px; font-weight:600; cursor:pointer}
  .btn.primary{background:var(--cyan-dim); border-color:var(--cyan-b); color:var(--cyan)}
  .btn.danger{background:var(--red-dim); border-color:var(--red-b); color:var(--red)}
  .btn:hover{filter:brightness(1.12)}
  .btn-icon-sm{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .btn-icon-sm:hover{color:var(--t1);border-color:var(--border2)}

  /* ───────── Responsive: mobile bottom nav ───────── */
  @media (max-width: 860px){
    #shell{flex-direction:column}
    #nav{
      width:100%; height:var(--bottomnav-h); order:2; flex-direction:row; align-items:stretch;
      padding:4px 4px; gap:2px; border-right:0; border-top:1px solid var(--border);
      padding-bottom:calc(4px + env(safe-area-inset-bottom));
    }
    .brand, .nav-sep, .nav-foot{display:none}
    .nav-item{flex:1; flex-direction:column; justify-content:center; gap:3px; padding:6px 2px; border-radius:10px}
    .nav-item.active::before{left:50%; top:2px; bottom:auto; width:18px; height:3px; transform:translateX(-50%)}
    .nav-label{text-align:center}
    .nav-label span{display:none}
    .nav-label b{font-size:9.5px; font-weight:600; overflow:visible; white-space:normal}
    .nav-icon{width:22px;height:22px;font-size:11px}
    .status-dot{position:absolute; top:2px; right:16%}
    #main{order:1; flex:1; min-height:0}
    .cards{grid-template-columns:1fr}
    .pipeline{display:none}
    #view-overview{padding:16px 14px 40px}
  }
  @media (min-width: 861px){
    .nav-item{position:relative}
  }

  .hidden{display:none !important}
  .kbd{font-family:var(--mono); font-size:10px; background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:1px 5px}
</style>
</head>
<body>

<div id="shell">
  <nav id="nav"></nav>
  <div id="main">
    <div id="topbar">
      <div class="crumb" id="crumb"><b>Tổng quan dự án</b></div>
      <div class="spacer"></div>
      <button id="advanceBtn" title="Xuất dữ liệu trạm hiện tại và chuyển sang trạm kế tiếp">
        <span id="advanceLabel">Xuất &amp; chuyển tiếp →</span>
      </button>
      <button class="icon-btn" id="btnBackup" title="Sao lưu toàn bộ dự án (.json)" style="position:relative">💾<span id="backupDot" class="status-dot" style="position:absolute;top:3px;right:3px"></span></button>
      <button class="icon-btn" id="btnLang" title="Ngôn ngữ / Language">🌐</button>
      <button class="icon-btn" id="btnInstall" title="Cài đặt ứng dụng" style="display:none">⬇</button>
      <button class="icon-btn" id="btnProjects" title="Quản lý dự án">☰</button>
    </div>
    <div id="content">
      <div id="view-overview"></div>
      <div id="frames"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<script>
(function(){
'use strict';

/* ════════════════════════════════════════════════════════════════════
   1) CẤU HÌNH TRẠM + DAG ĐIỀU HƯỚNG
   ════════════════════════════════════════════════════════════════════ */
var I18N = {
  vi: {
    overview:'Tổng quan', overviewSub:'Theo dõi tiến độ toàn bộ dự án qua 4 trạm tính toán',
    openStation:'Mở trạm →', notStarted:'Chưa có dữ liệu', ready:'Sẵn sàng nhận', pass:'Đạt', warn:'Cảnh báo', fail:'Không đạt',
    projects:'Dự án', newProject:'+ Dự án mới', rename:'Đổi tên', duplicate:'Nhân bản', deleteProject:'Xoá dự án',
    exportProject:'Xuất toàn bộ (.json)', importProject:'Nhập dự án (.json)', close:'Đóng', save:'Lưu',
    advance:'Xuất & chuyển tiếp →', loadingStation:'Đang tải trạm…', backToOverview:'← Tổng quan',
    emptyHint:'Bắt đầu từ <b>Trạm 1 — RefrigDesignNH3</b>: chạy tính toán chu trình lạnh, rồi bấm nút "Xuất &amp; chuyển tiếp" (hoặc nút xuất bên trong trạm) — dữ liệu sẽ tự động điền sẵn ở trạm kế tiếp, bạn chỉ cần xem lại và bấm xác nhận.',
    deliveredToast:'Đã chuyển dữ liệu sang', bgToast:'đã nhận dữ liệu nền từ', confirmedToast:'đã xác nhận nhập dữ liệu từ',
    lastUpdated:'Cập nhật', noProjectsYet:'Chưa có dự án nào', createFirst:'Tạo dự án đầu tiên',
    projectName:'Tên dự án', confirmDeleteProject:'Xoá dự án này? Toàn bộ dữ liệu bàn giao (bundle) giữa các trạm trong Hub sẽ mất — dữ liệu đã lưu BÊN TRONG từng trạm (IndexedDB riêng của từng app) KHÔNG bị ảnh hưởng.',
    installApp:'Cài ứng dụng lên máy/điện thoại',
    backupNow:'Sao lưu ngay (.json)', restoreBackup:'Khôi phục từ file sao lưu (.json)',
    backupDownloaded:'Đã tải file sao lưu toàn bộ dự án', backupNever:'Chưa sao lưu lần nào',
    backupReminderTitle:'Nên sao lưu dự án', backupReminderMsg:'Đã lâu chưa tải file sao lưu — bấm nút 💾 trên thanh công cụ để lưu lại phòng khi mất dữ liệu.',
    beforeUnloadWarning:'Có dữ liệu ở Trạm 2/Trạm 4 chưa được sao lưu ra file — nếu rời trang bây giờ có thể mất dữ liệu (2 trạm này không tự lưu trình duyệt).',
    restoreDone:'Đã khôi phục dự án từ file sao lưu', restoreInvalid:'File sao lưu không hợp lệ',
    restorePending:'sẽ được khôi phục khi bạn mở trạm đó'
  },
  en: {
    overview:'Overview', overviewSub:'Track progress across all 4 calculation stations',
    openStation:'Open station →', notStarted:'No data yet', ready:'Ready to receive', pass:'Pass', warn:'Warning', fail:'Fail',
    projects:'Projects', newProject:'+ New project', rename:'Rename', duplicate:'Duplicate', deleteProject:'Delete project',
    exportProject:'Export all (.json)', importProject:'Import project (.json)', close:'Close', save:'Save',
    advance:'Export & advance →', loadingStation:'Loading station…', backToOverview:'← Overview',
    emptyHint:'Start at <b>Station 1 — RefrigDesignNH3</b>: run the refrigeration cycle calculation, then click "Export &amp; advance" (or the station’s own export button) — data will auto-fill at the next station; just review and confirm.',
    deliveredToast:'Data sent to', bgToast:'received background data from', confirmedToast:'confirmed import from',
    lastUpdated:'Updated', noProjectsYet:'No projects yet', createFirst:'Create first project',
    projectName:'Project name', confirmDeleteProject:'Delete this project? All handoff bundles between stations in the Hub will be lost — data already saved INSIDE each station (its own IndexedDB) is not affected.',
    installApp:'Install app to device',
    backupNow:'Back up now (.json)', restoreBackup:'Restore from backup file (.json)',
    backupDownloaded:'Full project backup downloaded', backupNever:'Never backed up',
    backupReminderTitle:'Consider backing up', backupReminderMsg:'It has been a while since your last backup file — click 💾 in the toolbar to save one in case of data loss.',
    beforeUnloadWarning:'Station 2/Station 4 have data that has not been backed up to a file — leaving now may lose it (these two stations do not persist to the browser on their own).',
    restoreDone:'Project restored from backup file', restoreInvalid:'Invalid backup file',
    restorePending:'will be restored when you open that station'
  }
};
var lang = localStorage.getItem('hubshell_lang') || 'vi';

var STATIONS = {
  refrigdesign:   { file:'RefrigDesignNH3.html',            ns:'RefrigDesignNH3', num:1, short:'Trạm 1', label:'RefrigDesignNH3',            desc:'Chu trình lạnh NH3 · máy nén · dàn ngưng · thiết bị phụ tải', accent:'cyan'    },
  nh3vessel:      { file:'NH3_Vessel_Calculator.html',      ns:'AppNH3Vessel',   num:2, short:'Trạm 2', label:'NH3 Vessel Calculator',       desc:'Sizing sơ bộ bình chứa/trung gian/economizer NH3',            accent:'green'   },
  pressurevessel: { file:'Pressure_Vessel_Calculator.html', ns:'AppPV',          num:3, short:'Trạm 3', label:'Pressure Vessel Calculator',  desc:'Kiểm bền cơ khí ASME/TCVN · nozzle · áp suất ngoài',          accent:'amber'   },
  boq:            { file:'BOQ_Cost_Estimate_Calculator.html', ns:'AppBOQ',       num:4, short:'Trạm 4', label:'BOQ & Cost Estimate',         desc:'Khái toán chi phí đầu tư & vận hành',                          accent:'fuchsia' }
};
var STATION_ORDER = ['refrigdesign','nh3vessel','pressurevessel','boq'];

// from>to  ->  { primary }.  primary = trạm Hub tự động chuyển tab tới.
// Cạnh không-primary vẫn được lưu + tự điền ngay khi người dùng mở trạm đó, chỉ không "cướp" focus.
var FANOUT = {
  'refrigdesign>nh3vessel':      [ {to:'nh3vessel',      primary:true},  {to:'pressurevessel', primary:false} ],
  'refrigdesign>boq':            [ {to:'boq',            primary:false} ],

/* ════════════════════════════════════════════════════════════════════
   2) STATE + PERSISTENCE (đa dự án ở cấp Hub — độc lập với multi-project
      nội bộ của từng trạm, chỉ lưu các bundle bàn giao)
   ════════════════════════════════════════════════════════════════════ */
var LS_INDEX = 'hubshell_projects';
var LS_ACTIVE = 'hubshell_active_project';
function LS_PROJECT(id){ return 'hubshell_project_'+id; }

function loadIndex(){ try{ return JSON.parse(localStorage.getItem(LS_INDEX))||[]; }catch(e){ return []; } }
function saveIndex(idx){ localStorage.setItem(LS_INDEX, JSON.stringify(idx)); }
function loadProject(id){ try{ return JSON.parse(localStorage.getItem(LS_PROJECT(id))); }catch(e){ return null; } }
function saveProject(p){ p.updatedAt = Date.now(); localStorage.setItem(LS_PROJECT(p.id), JSON.stringify(p));
  var idx = loadIndex(); var row = idx.find(function(r){return r.id===p.id;});
  if(row){ row.name=p.name; row.updatedAt=p.updatedAt; } else { idx.push({id:p.id,name:p.name,updatedAt:p.updatedAt}); }
  saveIndex(idx);
}
function newProject(name){
  return { id:'proj_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name: name||'Dự án mới',
    createdAt:Date.now(), updatedAt:Date.now(), bundles:{}, delivered:{}, confirmed:{} };
}

var project = null;
function ensureProject(){
  var idx = loadIndex();
  var activeId = localStorage.getItem(LS_ACTIVE);
  if(activeId && idx.find(function(r){return r.id===activeId;})){
    project = loadProject(activeId);
  }
  if(!project){
    if(idx.length){ project = loadProject(idx[0].id); }
  }
  if(!project){
    project = newProject(lang==='vi' ? 'Dự án 1' : 'Project 1');
    saveProject(project);
  }
  localStorage.setItem(LS_ACTIVE, project.id);
}

var activeView = 'overview'; // 'overview' | stationId
var mounted = {}; // stationId -> {iframe, ready, wrap}

function gateBadgeClass(status){
  if(status==='FAIL') return 'fail';
  if(status==='WARN') return 'warn';
  if(status==='PASS') return 'pass';
  return 'pending';
}
function edgeKeysFrom(stId){ return Object.keys(FANOUT).filter(function(k){ return k.indexOf(stId+'>')===0; }); }
function edgeKeysTo(stId){
  var out=[];
  Object.keys(FANOUT).forEach(function(k){ FANOUT[k].forEach(function(e){ if(e.to===stId) out.push(k+'>'+e.to); }); });
  return out;
}
function stationOverallStatus(stId){
  // Trạm có bundle XUẤT ĐI (nghĩa là đã tính xong) -> lấy gate xấu nhất trong các bundle liên quan đến trạm này
  var keys = edgeKeysFrom(stId).concat(edgeKeysTo(stId));
  var worst = null; var rank = {PASS:0, WARN:1, FAIL:2};
  keys.forEach(function(k){
    var rec = project.bundles[k];
    if(!rec) return;
    var b = rec.bundle;
    if(b && b.stages){
      Object.keys(b.stages).forEach(function(s){
        var st = b.stages[s].status;
        if(st && (worst===null || rank[st]>rank[worst])) worst = st;
      });
    }
  });
  var hasOutgoing = edgeKeysFrom(stId).some(function(k){ return !!project.bundles[k]; });
  var hasIncomingPending = edgeKeysTo(stId).some(function(k){ return project.bundles[k] && !project.confirmed[k]; });
  if(worst) return {status:worst, hasOutgoing:hasOutgoing, hasIncomingPending:hasIncomingPending};
  return {status:null, hasOutgoing:hasOutgoing, hasIncomingPending:hasIncomingPending};
}

function renderNav(){
  var nav = document.getElementById('nav');
  var html = '';
  html += '<div class="brand"><div class="brand-mark"></div><div class="brand-text"><b>Hub Shell</b><span>'+esc(project.name)+'</span></div></div>';
  html += navItem('overview', '◆', T('overview'), (lang==='vi'?'Bảng điều khiển':'Dashboard'), null, 'cyan');
  html += '<div class="nav-sep"></div>';
  STATION_ORDER.forEach(function(id){
    var s = STATIONS[id];
    var os = stationOverallStatus(id);
    var dotClass = 'pending';
    if(os.status==='FAIL') dotClass='fail'; else if(os.status==='WARN') dotClass='warn'; else if(os.status==='PASS') dotClass='pass';
    else if(os.hasOutgoing) dotClass='pass';
    var pulse = os.hasIncomingPending ? ' pulse' : '';
    if(os.hasIncomingPending && dotClass==='pending') dotClass='ready';
    html += navItem(id, String(s.num), s.label, s.short, dotClass+pulse, s.accent);
  });
  html += '<div class="nav-foot"><div style="font-size:9.5px;color:var(--t3);padding:4px 8px">Hub Shell v'+HUB_SHELL_VERSION+'</div></div>';
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(function(el){
    el.addEventListener('click', function(){ go(el.dataset.id); });
  });
}
function navItem(id, iconTxt, title, sub, dotClass, accent){
  var vars = accentVars(accent);
  return '<div class="nav-item'+(activeView===id?' active':'')+'" data-id="'+id+'" style="'+vars+'">'+
    '<div class="nav-icon">'+iconTxt+'</div>'+
    '<div class="nav-label"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div>'+
    (dotClass? '<div class="status-dot '+dotClass+'"></div>' : '')+
  '</div>';
}
function accentVars(accent){
  var map = {
    cyan:   '--accent:var(--cyan); --dim:var(--cyan-dim); --b:var(--cyan-b);',
    green:  '--accent:var(--green); --dim:var(--green-dim); --b:var(--green-b);',
    amber:  '--accent:var(--amber); --dim:var(--amber-dim); --b:var(--amber-b);',
    fuchsia:'--accent:var(--fuchsia); --dim:var(--fuchsia-dim); --b:var(--fuchsia-b);'
  };
  return map[accent]||map.cyan;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderTopbar(){
  var crumb = document.getElementById('crumb');

  if(activeView==='overview'){
    crumb.innerHTML = '<b>'+T('overview')+'</b>';

  } else {

    var homeEl = document.getElementById('crumbHome');

}

/* ════════════════════════════════════════════════════════════════════
   5) IFRAME MOUNTING + HUB BRIDGE (export/import events)
   ════════════════════════════════════════════════════════════════════ */
function mountStation(id){
  if(mounted[id]) return mounted[id];
  var frames = document.getElementById('frames');
  var wrap = document.createElement('div');
  wrap.className = 'frame-wrap';
  wrap.id = 'wrap-'+id;
  var loading = document.createElement('div');
  loading.className = 'frame-loading';
  loading.innerHTML = '<div class="spinner"></div><div>'+T('loadingStation')+'</div>';
  var iframe = document.createElement('iframe');
  iframe.src = STATIONS[id].file;
  iframe.setAttribute('loading','lazy');
  iframe.title = STATIONS[id].label;
  wrap.appendChild(loading);
  wrap.appendChild(iframe);
  frames.appendChild(wrap);
  var rec = { iframe:iframe, wrap:wrap, ready:false, loadingEl:loading };
  mounted[id] = rec;

  iframe.addEventListener('load', function(){
    bindBridge(id, rec);
  });
  return rec;
}

function bindBridge(id, rec){
  var win;
  try{ win = rec.iframe.contentWindow; }catch(e){ win = null; }
  if(!win){ rec.loadingEl.style.display='none'; return; }

  win.addEventListener('HUB:export', function(ev){ handleExport(id, ev.detail||{}); });
  win.addEventListener('HUB:import', function(ev){ handleImport(id, ev.detail||{}); });

  // Poll cho tới khi namespace + exportProjectData/importProjectData sẵn sàng (app tự khởi tạo async)
  var tries = 0;
  var timer = setInterval(function(){
    tries++;
    var ns = win[STATIONS[id].ns];
    var ok = ns && (ns.importProjectData || ns.exportProjectData);
    if(ok || tries>60){ // ~9s timeout
      clearInterval(timer);
      rec.ready = true;
      rec.loadingEl.style.display = 'none';
      deliverPending(id);
      deliverPendingRestore(id);
    }
  }, 150);
}

function deliverPending(toId){
  edgeKeysTo(toId).forEach(function(k){
    if(project.bundles[k] && !project.delivered[k]){
      deliverBundle(k, toId);
    }
  });
}

function deliverBundle(edgeKey, toId){
  var rec = mounted[toId];
  if(!rec || !rec.ready) return;
  var win; try{ win = rec.iframe.contentWindow; }catch(e){ return; }
  var ns = win[STATIONS[toId].ns];
  if(!ns || !ns.importProjectData) return;
  var payload = project.bundles[edgeKey];
  if(!payload) return;
  try{ ns.importProjectData(payload.bundle); }catch(e){ console.error('[HubShell] importProjectData lỗi', edgeKey, e); }
  project.delivered[edgeKey] = true;
  saveProject(project);
  var fromId = edgeKey.split('>')[0];
  toast('info', STATIONS[toId].short, (STATIONS[fromId]? (STATIONS[fromId].short+' → ') : '') + T('bgToast')+' '+(STATIONS[fromId]?STATIONS[fromId].label:''));
  renderNav();
}

function handleExport(fromId, detail){
  var to = detail.to;
  var bundle = detail.bundle;
  if(!to || !bundle){ return; }
  var edgeKey = fromId+'>'+to;
  var known = FANOUT[fromId+'>'+to];
  var routes = known || [{to:to, primary:true}];
  routes.forEach(function(route){
    var key = fromId+'>'+route.to;
    project.bundles[key] = { bundle: bundle, exportedAt: new Date().toISOString() };
    project.delivered[key] = false;
    saveProject(project);
    if(route.primary){
      go(route.to);
      // đảm bảo mount + deliver ngay (go() đã mount, chờ ready rồi deliver qua deliverPending)
      var check = setInterval(function(){
        var rec = mounted[route.to];
        if(rec && rec.ready){ clearInterval(check); deliverBundle(key, route.to); }
      }, 120);
      setTimeout(function(){ clearInterval(check); }, 12000);
      toast('ok', STATIONS[route.to].short, T('deliveredToast')+' '+STATIONS[route.to].label);
    } else {
      // nếu trạm đích đã đang mở sẵn -> deliver luôn; nếu chưa -> chờ tới khi user mở
      var rec2 = mounted[route.to];
      if(rec2 && rec2.ready) deliverBundle(key, route.to);
    }
  });
  renderNav();
  if(activeView==='overview') renderOverview();
}

function handleImport(toId, detail){
  var from = detail.from;
  if(from){
    var key = from+'>'+toId;
    if(project.bundles[key]){ project.confirmed[key] = true; saveProject(project); }
  } else {
    // BOQ (terminal) không gắn "from" cụ thể — đánh dấu tất cả cạnh trỏ tới BOQ đã confirm
    edgeKeysTo(toId).forEach(function(k){ if(project.bundles[k]) project.confirmed[k]=true; });
    saveProject(project);
  }
  renderNav();
  if(activeView==='overview') renderOverview();
  toast('ok', STATIONS[toId].short, STATIONS[toId].label+' '+T('confirmedToast')+(from?(' '+STATIONS[from].label):''));
}

/* ════════════════════════════════════════════════════════════════════
   6) ĐIỀU HƯỚNG
   ════════════════════════════════════════════════════════════════════ */
function go(id){
  activeView = id;
  document.getElementById('view-overview').style.display = id==='overview' ? 'block' : 'none';
  Object.keys(mounted).forEach(function(k){ mounted[k].wrap.classList.toggle('active', k===id); });
  if(id!=='overview'){
    var rec = mountStation(id);
    rec.wrap.classList.add('active');
    if(rec.ready){ deliverPending(id); deliverPendingRestore(id); }
  } else {
    renderOverview();
  }
  renderNav();
  renderTopbar();
  location.hash = id==='overview' ? '' : id;
}

document.getElementById('advanceBtn').addEventListener('click', function(){
  if(activeView==='overview') return;
  var rec = mounted[activeView];
  if(!rec || !rec.ready) return;
  var win; try{ win = rec.iframe.contentWindow; }catch(e){ return; }
  var ns = win[STATIONS[activeView].ns];
  if(ns && ns.exportProjectData){
    try{ ns.exportProjectData(); }catch(e){ console.error(e); }
  }
});

/* ════════════════════════════════════════════════════════════════════
   7b) BACKUP CENTER — Trạm 2 (NH3 Vessel) và Trạm 4 (BOQ) không tự lưu
   trình duyệt (không IndexedDB/localStorage cho dữ liệu làm việc) — mất
   trắng nếu F5/đóng nhầm tab. Hub Shell gom trạng thái đầy đủ của MỌI trạm
   đang mở (qua exportFullBackup(), không phải chỉ bundle bàn giao) thành
   1 file .json duy nhất, nhắc định kỳ, và cảnh báo trước khi rời trang nếu
   có dữ liệu chưa sao lưu ra file.
   ════════════════════════════════════════════════════════════════════ */
var NO_PERSISTENCE_STATIONS = ['nh3vessel','boq']; // 2 trạm rủi ro mất dữ liệu cao nhất
var BACKUP_REMINDER_MS = 15*60*1000; // 15 phút

function lastBackupKey(){ return 'hubshell_last_backup_'+project.id; }
function getLastBackupAt(){ var v = localStorage.getItem(lastBackupKey()); return v ? parseInt(v,10) : 0; }
function setLastBackupAt(ts){ localStorage.setItem(lastBackupKey(), String(ts)); renderBackupDot(); }

function collectFullBackup(){
  var stations = {};
  STATION_ORDER.forEach(function(id){
    var rec = mounted[id];
    if(!rec || !rec.ready) return;
    var win; try{ win = rec.iframe.contentWindow; }catch(e){ return; }
    var ns = win[STATIONS[id].ns];
    if(!ns || !ns.exportFullBackup) return;
    try{ var data = ns.exportFullBackup(); if(data) stations[id] = data; }
    catch(e){ console.error('[HubShell] exportFullBackup lỗi ở', id, e); }
  });
  return { format:'hubshell-full-backup', version:1, generatedAt:new Date().toISOString(), hubProject: project, stations: stations };
}

function hasAnyMountedStationWithData(){
  return STATION_ORDER.some(function(id){ return mounted[id] && mounted[id].ready; });
}

function downloadBackup(silent){
  var snapshot = collectFullBackup();
  if(!Object.keys(snapshot.stations).length && !silent){
    toast('info', T('backupNow'), lang==='vi' ? 'Chưa có trạm nào đang mở để sao lưu — mở ít nhất 1 trạm trước.' : 'No station is open yet to back up — open at least one station first.');
    return;
  }
  var blob = new Blob([JSON.stringify(snapshot,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'HubShell_FullBackup_'+project.name.replace(/\s+/g,'_')+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setLastBackupAt(Date.now());
  if(!silent) toast('ok', T('backupNow'), T('backupDownloaded'));
}
document.getElementById('btnBackup').addEventListener('click', function(){ downloadBackup(false); });

function renderBackupDot(){
  var dot = document.getElementById('backupDot');
  if(!dot) return;
  var last = getLastBackupAt();
  var cls = 'pending';
  if(last){
    var age = Date.now()-last;
    cls = age < BACKUP_REMINDER_MS ? 'pass' : age < BACKUP_REMINDER_MS*2 ? 'warn' : 'fail';
  }
  dot.className = 'status-dot '+cls;
  var btn = document.getElementById('btnBackup');
  if(btn) btn.title = T('backupNow') + ' — ' + (last ? (T('lastUpdated')+' '+new Date(last).toLocaleString(lang==='vi'?'vi-VN':'en-US')) : T('backupNever'));
}

// ── Nhắc định kỳ (không chặn thao tác) — chỉ nhắc khi có trạm rủi ro cao đang mở ──
setInterval(function(){
  if(document.visibilityState!=='visible') return;
  var last = getLastBackupAt();
  var risky = NO_PERSISTENCE_STATIONS.some(function(id){ return mounted[id] && mounted[id].ready; });
  if(!risky) return;
  if(last && (Date.now()-last) < BACKUP_REMINDER_MS) return;
  toast('warn', T('backupReminderTitle'), T('backupReminderMsg'));
  setLastBackupAt(Date.now()); // tránh nhắc liên tục — tính lại mốc "đã nhắc" như đã sao lưu tạm thời
}, 5*60*1000);

// ── Cảnh báo rời trang nếu Trạm 2/4 (không tự lưu) đang có dữ liệu và
// backup file gần nhất đã quá cũ (hoặc chưa từng có) ──
window.addEventListener('beforeunload', function(e){
  var last = getLastBackupAt();
  var stale = !last || (Date.now()-last) > BACKUP_REMINDER_MS;
  var riskyHasData = NO_PERSISTENCE_STATIONS.some(function(id){ return mounted[id] && mounted[id].ready; });
  if(riskyHasData && stale){
    e.preventDefault();
    e.returnValue = T('beforeUnloadWarning');
    return e.returnValue;
  }
});

// ── Khôi phục từ file sao lưu toàn bộ — đọc file, thay project Hub, rồi giao
// từng phần dữ liệu trạm ngay khi trạm đó được mở (mount) lần đầu ──
var pendingRestoreStations = null; // {stationId: data} chờ giao khi user mở trạm
function applyFullBackupFile(snapshot){
  if(!snapshot || snapshot.format!=='hubshell-full-backup' || !snapshot.stations){ throw new Error('invalid'); }
  if(snapshot.hubProject){
    var restored = snapshot.hubProject;
    restored.id = 'proj_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    project = restored;
    saveProject(project);
    localStorage.setItem(LS_ACTIVE, project.id);
  }
  pendingRestoreStations = snapshot.stations;
  remountAll();
  // Giao ngay cho trạm hiện đang mở/sẽ mount đầu tiên (overview) — phần còn lại chờ deliverPendingRestore()
  var names = Object.keys(pendingRestoreStations).map(function(id){ return STATIONS[id] ? STATIONS[id].short : id; });
  toast('ok', T('restoreDone'), names.join(', ') + ' — ' + T('restorePending'));
}
function deliverPendingRestore(stationId){
  if(!pendingRestoreStations || !pendingRestoreStations[stationId]) return;
  var rec = mounted[stationId];
  if(!rec || !rec.ready) return;
  var win; try{ win = rec.iframe.contentWindow; }catch(e){ return; }
  var ns = win[STATIONS[stationId].ns];
  if(!ns || !ns.importFullBackup) return;
  try{ ns.importFullBackup(pendingRestoreStations[stationId]); }catch(e){ console.error('[HubShell] importFullBackup lỗi', stationId, e); }
  delete pendingRestoreStations[stationId];
}

/* ════════════════════════════════════════════════════════════════════
   8) MODAL — QUẢN LÝ DỰ ÁN
   ════════════════════════════════════════════════════════════════════ */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

function openProjectsModal(){
  var idx = loadIndex().sort(function(a,b){ return b.updatedAt-a.updatedAt; });
  var rows = idx.map(function(r){
    return '<div class="modal-row'+(r.id===project.id?' selected':'')+'" data-id="'+r.id+'">'+
      '<div><div class="modal-row-title">'+esc(r.name)+'</div><div class="modal-row-sub">'+new Date(r.updatedAt).toLocaleString(lang==='vi'?'vi-VN':'en-US')+'</div></div>'+
      '<div style="display:flex;gap:6px">'+
        '<button class="btn-icon-sm" data-act="rename" data-id="'+r.id+'" title="'+T('rename')+'">✎</button>'+
        '<button class="btn-icon-sm" data-act="del" data-id="'+r.id+'" title="'+T('deleteProject')+'">🗑</button>'+
      '</div></div>';
  }).join('') || '<div class="modal-row-sub" style="padding:8px 2px">'+T('noProjectsYet')+'</div>';

  openModal(
    '<div class="modal-head"><b>'+T('projects')+'</b><button class="icon-btn" id="mClose">✕</button></div>'+
    '<div class="modal-body">'+
      rows+
      '<div class="btn-row"><button class="btn primary" id="mNew">'+T('newProject')+'</button></div>'+
      '<div class="btn-row"><button class="btn primary" id="mBackupNow">💾 '+T('backupNow')+'</button><label class="btn primary" style="text-align:center;cursor:pointer">📂 '+T('restoreBackup')+'<input type="file" id="mRestoreFile" accept=".json" class="hidden"></label></div>'+
      '<div class="modal-row-sub" style="padding:0 2px 4px">'+(lang==='vi'?'Sao lưu toàn bộ = dữ liệu tính toán thật của mọi trạm đang mở (khuyên dùng thường xuyên, đặc biệt Trạm 2 &amp; 4). Bên dưới chỉ là bản ghi bàn giao nội bộ của Hub, không thay thế được bản sao lưu toàn bộ.':'Full backup = the real working data of every currently open station (use this often, especially Stations 2 &amp; 4). The row below is only the Hub’s internal handoff record — it does not replace a full backup.')+'</div>'+
      '<div class="btn-row"><button class="btn" id="mExport">'+T('exportProject')+'</button><label class="btn" style="text-align:center;cursor:pointer">'+T('importProject')+'<input type="file" id="mImportFile" accept=".json" class="hidden"></label></div>'+
    '</div>'
  );
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mNew').addEventListener('click', function(){
    var name = prompt(T('projectName'), lang==='vi'?'Dự án mới':'New project');
    if(name===null) return;
    project = newProject(name||'Project');
    saveProject(project);
    localStorage.setItem(LS_ACTIVE, project.id);
    remountAll();
    closeModal();
  });
  document.getElementById('mBackupNow').addEventListener('click', function(){ downloadBackup(false); closeModal(); });
  document.getElementById('mRestoreFile').addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(ev){
      try{ applyFullBackupFile(JSON.parse(ev.target.result)); closeModal(); }
      catch(err){ alert(T('restoreInvalid')); }
    };
    r.readAsText(f);
  });
  document.getElementById('mExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(project,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'HubShell_'+project.name.replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
  });
  document.getElementById('mImportFile').addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(ev){
      try{
        var p = JSON.parse(ev.target.result);
        if(!p.id || !p.bundles) throw new Error('invalid');
        p.id = 'proj_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        saveProject(p);
        project = p;
        localStorage.setItem(LS_ACTIVE, project.id);
        remountAll();
        closeModal();
      }catch(err){ alert(lang==='vi'?'File dự án không hợp lệ':'Invalid project file'); }
    };
    r.readAsText(f);
  });
  document.getElementById('modalBox').querySelectorAll('.modal-row[data-id]').forEach(function(row){
    row.addEventListener('click', function(e){
      if(e.target.closest('button')) return;
      var id = row.dataset.id;
      if(id===project.id){ closeModal(); return; }
      project = loadProject(id);
      localStorage.setItem(LS_ACTIVE, project.id);
      remountAll();
      closeModal();
    });
  });
  document.getElementById('modalBox').querySelectorAll('button[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id = btn.dataset.id;
      if(btn.dataset.act==='rename'){
        var p = id===project.id ? project : loadProject(id);
        var name = prompt(T('projectName'), p.name);
        if(name===null) return;
        p.name = name||p.name;
        saveProject(p);
        if(id===project.id) renderNav();
        openProjectsModal();
      } else if(btn.dataset.act==='del'){
        if(!confirm(T('confirmDeleteProject'))) return;
        localStorage.removeItem(LS_PROJECT(id));
        var idx2 = loadIndex().filter(function(r){return r.id!==id;});
        saveIndex(idx2);
        if(id===project.id){
          project = idx2.length ? loadProject(idx2[0].id) : newProject();
          if(!idx2.length) saveProject(project);
          localStorage.setItem(LS_ACTIVE, project.id);
          remountAll();
        }
        openProjectsModal();
      }
    });
  });
}
document.getElementById('btnProjects').addEventListener('click', openProjectsModal);

function remountAll(){
  Object.keys(mounted).forEach(function(k){ mounted[k].wrap.remove(); });
  mounted = {};
  go('overview');
  renderBackupDot();
}

/* ════════════════════════════════════════════════════════════════════
   9) NGÔN NGỮ + PWA INSTALL + SERVICE WORKER
   ════════════════════════════════════════════════════════════════════ */
document.getElementById('btnLang').addEventListener('click', function(){
  lang = lang==='vi' ? 'en' : 'vi';
  localStorage.setItem('hubshell_lang', lang);
  document.documentElement.lang = lang;
  renderNav(); renderTopbar(); renderBackupDot();
  if(activeView==='overview') renderOverview();
});

var deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('btnInstall').style.display = 'flex';
});
document.getElementById('btnInstall').addEventListener('click', function(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(function(){
    deferredInstallPrompt = null;
    document.getElementById('btnInstall').style.display = 'none';
  });
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ════════════════════════════════════════════════════════════════════
   10) KHỞI ĐỘNG
   ════════════════════════════════════════════════════════════════════ */
ensureProject();
document.documentElement.lang = lang;
var startId = (location.hash||'').replace('#','');
renderNav();
renderBackupDot();
if(startId && STATIONS[startId]){ go(startId); } else { go('overview'); }

window.addEventListener('beforeunload', function(){ saveProject(project); });

})();
</script>
</body>
</html>
