name: E2E tests — Hub Shell bridge contract

# Chạy khi PR sửa Hub_Shell.html hoặc 1 trong 4 file trạm — đây chính xác là
# nhóm file mà nếu ai đó đổi tên hàm/id DOM/shape bundle sẽ âm thầm phá vỡ
# cầu nối HUB:export/HUB:import mà Hub Shell đang dựa vào (xem
# PROJECT_DATA_CONTRACT.md). Cũng chạy khi tự sửa bộ test.
on:
  pull_request:
    paths:
      - 'Hub_Shell.html'
      - 'RefrigDesignNH3.html'
      - 'NH3_Vessel_Calculator.html'
      - 'Pressure_Vessel_Calculator.html'
      - 'BOQ_Cost_Estimate_Calculator.html'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Hub_Shell.html'
      - 'RefrigDesignNH3.html'
      - 'NH3_Vessel_Calculator.html'
      - 'Pressure_Vessel_Calculator.html'
      - 'BOQ_Cost_Estimate_Calculator.html'
      - 'tests/e2e/**'
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
